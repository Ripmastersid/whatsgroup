<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sid Marketing | Acesso VIP</title>
    <link rel="icon" href="favicon4.png">
    <meta property="og:image" content="favicon4.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="favicon4.png" alt="Logo" class="logo">
        <span class="brand-name">SID MARKETING</span>
    </header>

    <div id="container-1" class="glass-card">
        <h1>Por que ter um site hoje?</h1>
        <p>Descubra como a presença digital transforma o seu negócio.</p>
        <button class="btn-pill" onclick="showForm()">QUERO</button>
    </div>

    <div id="container-2" class="glass-card hidden">
        <form id="lead-form">
            <input type="text" id="nome" placeholder="Seu Nome" required>
            <input type="tel" id="numero" placeholder="Seu WhatsApp" required>
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <button type="submit" class="btn-pill btn-access">ACESSAR</button>
        </form>
    </div>

    <footer class="footer">sidnei.santos.marcketing@gmail.com</footer>
    <script src="script.js"></script>
</body>
</html>
